<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgHero" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE8D6"/>
      <stop offset="100%" stop-color="#FFD1B3"/>
    </linearGradient>
    <linearGradient id="collar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E05A47"/>
      <stop offset="100%" stop-color="#FF7F50"/>
    </linearGradient>
  </defs>
  <rect width="600" height="480" rx="32" fill="url(#bgHero)"/>
  <circle cx="480" cy="110" r="65" fill="#FFF3E8" opacity="0.7"/>
  <circle cx="110" cy="380" r="85" fill="#FFF3E8" opacity="0.6"/>
  <!-- Paw prints background -->
  <g fill="#E89973" opacity="0.22">
    <circle cx="130" cy="110" r="14"/>
    <circle cx="112" cy="88" r="7"/>
    <circle cx="130" cy="82" r="7"/>
    <circle cx="148" cy="88" r="7"/>
    <circle cx="490" cy="360" r="16"/>
    <circle cx="470" cy="335" r="8"/>
    <circle cx="490" cy="328" r="8"/>
    <circle cx="510" cy="335" r="8"/>
  </g>
  <!-- Cushion / Base -->
  <ellipse cx="300" cy="400" rx="190" ry="38" fill="#1E293B" opacity="0.12"/>
  <!-- Happy Golden Dog Illustration -->
  <g transform="translate(150, 75)">
    <!-- Tail -->
    <path d="M225 235 Q285 190 270 145 Q258 160 215 205 Z" fill="#D9822B"/>
    <!-- Body -->
    <rect x="75" y="165" width="150" height="145" rx="68" fill="#F09D42"/>
    <!-- Chest fur -->
    <ellipse cx="150" cy="220" rx="52" ry="48" fill="#FCE3C2"/>
    <!-- Front Paws -->
    <rect x="92" y="270" width="38" height="58" rx="18" fill="#FCE3C2"/>
    <rect x="170" y="270" width="38" height="58" rx="18" fill="#FCE3C2"/>
    <!-- Collar -->
    <rect x="88" y="152" width="124" height="24" rx="12" fill="url(#collar)"/>
    <circle cx="150" cy="182" r="13" fill="#FBBF24" stroke="#B45309" stroke-width="3"/>
    <!-- Ears -->
    <path d="M75 55 Q25 70 38 145 Q55 155 85 110 Z" fill="#C9731E"/>
    <path d="M225 55 Q275 70 262 145 Q245 155 215 110 Z" fill="#C9731E"/>
    <!-- Head -->
    <rect x="72" y="30" width="156" height="135" rx="65" fill="#F4A853"/>
    <!-- Snout -->
    <ellipse cx="150" cy="118" rx="46" ry="34" fill="#FCE3C2"/>
    <!-- Nose -->
    <ellipse cx="150" cy="102" rx="18" ry="12" fill="#1E293B"/>
    <ellipse cx="145" cy="99" rx="5" ry="3" fill="#64748B"/>
    <!-- Smile & Tongue -->
    <path d="M132 122 Q150 138 168 122" fill="none" stroke="#1E293B" stroke-width="4" stroke-linecap="round"/>
    <path d="M141 128 Q150 155 159 128 Z" fill="#F43F5E"/>
    <!-- Eyes -->
    <circle cx="112" cy="82" r="10" fill="#1E293B"/>
    <circle cx="109" cy="79" r="3.5" fill="#FFFFFF"/>
    <circle cx="188" cy="82" r="10" fill="#1E293B"/>
    <circle cx="185" cy="79" r="3.5" fill="#FFFFFF"/>
    <!-- Eyebrows -->
    <path d="M98 64 Q112 56 124 64" fill="none" stroke="#C9731E" stroke-width="4" stroke-linecap="round"/>
    <path d="M176 64 Q188 56 202 64" fill="none" stroke="#C9731E" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
